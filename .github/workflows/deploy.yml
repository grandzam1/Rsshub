name: Deploy host RSSHub (manual only)

on:
    workflow_dispatch:
        inputs:
            restart_host:
                description: 'Explicitly rebuild and restart the existing host RSSHub installation'
                type: boolean
                required: true
                default: false

permissions:
    contents: read

concurrency:
    group: rsshub-vps-operations
    cancel-in-progress: false

jobs:
    deploy:
        if: ${{ inputs.restart_host && github.repository == 'grandzam1/Rsshub' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Explicitly deploy host RSSHub over verified SSH
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
              shell: bash
              run: |
                  set -euo pipefail
                  umask 077
                  : "${VPS_HOST:?Configure VPS_HOST}"
                  : "${VPS_USER:?Configure VPS_USER}"
                  : "${VPS_SSH_KEY:?Configure VPS_SSH_KEY}"
                  : "${VPS_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS}"
                  [[ $VPS_HOST =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
                  [[ $VPS_USER =~ ^[a-z_][a-z0-9_-]*$ ]]
                  ssh_dir=$(mktemp -d)
                  trap 'rm -rf -- "$ssh_dir"' EXIT
                  printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/deploy_key"
                  printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
                  ssh -F /dev/null -i "$ssh_dir/deploy_key" \
                      -o BatchMode=yes -o IdentitiesOnly=yes \
                      -o StrictHostKeyChecking=yes \
                      -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
                      -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                      "$VPS_USER@$VPS_HOST" \
                      'sudo -n /usr/local/bin/rsshub-deploy.sh'
